name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Exit code 5 = "no tests collected". Allowed ONLY for the first scaffold commit; delete the
      # "|| test $? -eq 5" part once the first tests are merged.
      - run: pytest -q || test $? -eq 5
